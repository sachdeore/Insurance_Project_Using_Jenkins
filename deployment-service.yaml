apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuree-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insuree
  template:
    metadata:
      labels:
        app: insuree
    spec:
      containers:
      - name: insuree
        image: sachdeore/insuree:latest
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: insuree-service
spec:
  type: LoadBalancer
  selector:
    app: insuree
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8081
